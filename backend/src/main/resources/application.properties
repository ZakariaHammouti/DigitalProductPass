spring.application.name=backend
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/digitalProductPass}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.errors.show-details=${APP_ERRORS_SHOW_DETAILS:false}
# Sonar Problem: Session-Cookie nur bei Anfragen von der eigenen Seite mitschicken (Schutz gegen CSRF,
# weil CSRF in der SecurityConfig abgeschaltet ist;
server.servlet.session.cookie.same-site=lax