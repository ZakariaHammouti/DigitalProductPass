name: Frontend CI

on:
  push:
    branches: [ develop ]
    paths: [ 'frontend/**', '.github/workflows/frontend.yml' ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Sonar braucht die volle Historie

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Sonar-Analyse
        uses: SonarSource/sonarqube-scan-action@v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.organization=zakariahammouti-1
            -Dsonar.projectKey=zakariahammouti-1_DigitalProductPass_frontend
            -Dsonar.sources=src
            -Dsonar.coverage.exclusions=**/*